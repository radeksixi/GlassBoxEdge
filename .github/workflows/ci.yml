name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Validator tests (standard library only)
      run: python -m unittest discover -s tests -v

    - name: Offline edge node smoke run
      run: |
        python edge/edge_node.py --line A --device JET-A --seconds 3 --frame-seconds 1 --inject temp_c:+0.9:2
        test -s edge/out/JET-A-telemetry.jsonl
